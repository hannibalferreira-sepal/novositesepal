  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

cionar foto<input class=\"file-in\" type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{onPhotoFile}}\"><\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{photo.preview}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"row wrap\" style=\"gap: 20px\">\n            <span class=\"av lg\" style=\"width: 132px; height: 132px\"><img sc-camel-src=\"{{photoPreview}}\" alt=\"Pré-visualização da nova foto\"><\u002Fspan>\n            <div class=\"col\" style=\"gap: 10px; flex: 1 1 220px\">\n              <p><b>Pré-visualização<\u002Fb><\u002Fp>\n              <p class=\"muted small\">Ao enviar, abrimos uma solicitação de “Atualização de fotografia” para a equipe de Comunicação.<\u002Fp>\n              <div class=\"row wrap\"><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{sendPhoto}}\">Enviar foto<\u002Fbutton><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{cancelPhoto}}\">Escolher outra<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{photo.sent}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"note\">Solicitação #{{photoPendingId}} criada. Acompanhe em Solicitações — quando a equipe concluir, sua foto será atualizada e você receberá uma notificação.<\u002Fdiv>\n          <div class=\"row wrap\"><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{openPhotoReq}}\">Acompanhar solicitação<\u002Fbutton><button class=\"btn ghost\" type=\"button\" sc-camel-on-click=\"{{cancelPhoto}}\">Enviar outra foto<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <section class=\"card\">\n      <div class=\"card-h\"><h2>Informações<\u002Fh2><span class=\"muted small\">Campos com cadeado são mantidos pela SEPAL — peça a alteração por solicitação.<\u002Fspan><\u002Fdiv>\n      <div class=\"g3\">\n        <label class=\"lb\"><span class=\"row\" style=\"gap: 6px\">Nome <span class=\"lock\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>SEPAL<\u002Fspan><\u002Fspan><input class=\"in\" value=\"{{me.nome}}\" disabled=\"{{yes}}\"><\u002Flabel>\n        <label class=\"lb\"><span class=\"row\" style=\"gap: 6px\">E-mail <span class=\"lock\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>SEPAL<\u002Fspan><\u002Fspan><input class=\"in\" value=\"{{me.email}}\" disabled=\"{{yes}}\"><\u002Flabel>\n        <label class=\"lb\">Telefone<input class=\"in\" value=\"{{draft.tel}}\" disabled=\"{{notEditing}}\" sc-camel-on-change=\"{{ed.tel}}\"><\u002Flabel>\n        <label class=\"lb\"><span class=\"row\" style=\"gap: 6px\">País <span class=\"lock\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>SEPAL<\u002Fspan><\u002Fspan><input class=\"in\" value=\"{{me.pais}}\" disabled=\"{{yes}}\"><\u002Flabel>\n        <label class=\"lb\">Cidade<input class=\"in\" value=\"{{draft.cidade}}\" disabled=\"{{notEditing}}\" sc-camel-on-change=\"{{ed.cidade}}\"><\u002Flabel>\n        <label class=\"lb\"><span class=\"row\" style=\"gap: 6px\">Região <span class=\"lock\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>SEPAL<\u002Fspan><\u002Fspan><input class=\"in\" value=\"{{me.regiao}}\" disabled=\"{{yes}}\"><\u002Flabel>\n        <label class=\"lb\"><span class=\"row\" style=\"gap: 6px\">Área de atuação <span class=\"lock\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>SEPAL<\u002Fspan><\u002Fspan><input class=\"in\" value=\"{{me.area}}\" disabled=\"{{yes}}\"><\u002Flabel>\n        <label class=\"lb\"><span class=\"row\" style=\"gap: 6px\">Ministério <span class=\"lock\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>SEPAL<\u002Fspan><\u002Fspan><input class=\"in\" value=\"{{me.ministerio}}\" disabled=\"{{yes}}\"><\u002Flabel>\n        <label class=\"lb\">Redes sociais<input class=\"in\" value=\"{{draft.redes}}\" disabled=\"{{notEditing}}\" sc-camel-on-change=\"{{ed.redes}}\"><\u002Flabel>\n        <label class=\"lb span2\">Biografia<textarea class=\"in\" disabled=\"{{notEditing}}\" sc-camel-on-change=\"{{ed.bio}}\" value=\"{{draft.bio}}\"><\u002Ftextarea><\u002Flabel>\n        <label class=\"lb\">Projetos<textarea class=\"in\" disabled=\"{{notEditing}}\" sc-camel-on-change=\"{{ed.projetos}}\" value=\"{{draft.projetos}}\"><\u002Ftextarea><\u002Flabel>\n      <\u002Fdiv>\n      <sc-if value=\"{{editing}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"row wrap\"><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{saveEdit}}\">Salvar alterações<\u002Fbutton><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{cancelEdit}}\">Cancelar<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n      <div class=\"row wrap\"><button class=\"btn ghost\" type=\"button\" sc-camel-on-click=\"{{reqCadastro}}\">Pedir alteração de um campo bloqueado<\u002Fbutton><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ LIDERANÇA ============ -->\n  <sc-if value=\"{{scr.lideranca}}\" hint-placeholder-val=\"{{ false }}\">\n    <h1>Minha Liderança<\u002Fh1>\n    <div class=\"g3\">\n      <sc-for list=\"{{leadCards}}\" as=\"l\" hint-placeholder-count=\"3\">\n        <section class=\"card\">\n          <span class=\"tag\" style=\"align-self: flex-start\">{{l.nivel}}<\u002Fspan>\n          <div class=\"row\"><span class=\"av\">{{l.ini}}<\u002Fspan><div class=\"col\"><h3>{{l.nome}}<\u002Fh3><span class=\"muted\">{{l.funcao}}<\u002Fspan><span class=\"muted small\">{{l.local}}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"row wrap\"><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{contactLead}}\">E-mail<\u002Fbutton><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{contactLead}}\">WhatsApp<\u002Fbutton><\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <section class=\"card\">\n      <div class=\"card-h\"><h2>Equipe<\u002Fh2><span class=\"muted small\">Missionários sob a mesma liderança direta<\u002Fspan><\u002Fdiv>\n      <div class=\"g3\">\n        <sc-for list=\"{{lead.equipe}}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div class=\"row\"><span class=\"av sm\">{{p.ini}}<\u002Fspan><div class=\"col\"><b>{{p.nome}}<\u002Fb><span class=\"muted small\">{{p.local}}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p class=\"note\">Em breve: iniciar conversa com a liderança direto pela Central.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ MINISTÉRIO ============ -->\n  <sc-if value=\"{{scr.ministerio}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card-h\"><h1>Meu Ministério<\u002Fh1><span class=\"tag\">Regras de edição configuráveis pelo administrador<\u002Fspan><\u002Fdiv>\n    <div class=\"g4\">\n      <div class=\"card\"><span class=\"muted small\">Aglutinação<\u002Fspan><b>{{me.aglutinacao}}<\u002Fb><\u002Fdiv>\n      <div class=\"card\"><span class=\"muted small\">Área de atuação<\u002Fspan><b>{{me.area}}<\u002Fb><\u002Fdiv>\n      <div class=\"card\"><span class=\"muted small\">País<\u002Fspan><b>{{me.pais}}<\u002Fb><\u002Fdiv>\n      <div class=\"card\"><span class=\"muted small\">Região<\u002Fspan><b>{{me.regiao}}<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n    <section class=\"card\">\n      <h2>{{me.ministerio}}<\u002Fh2>\n      <label class=\"lb\">Descrição<textarea class=\"in\" value=\"{{me.descricao}}\" sc-camel-on-change=\"{{edMin.descricao}}\"><\u002Ftextarea><\u002Flabel>\n      <label class=\"lb\">Objetivos<textarea class=\"in\" value=\"{{me.objetivos}}\" sc-camel-on-change=\"{{edMin.objetivos}}\" style=\"min-height: 80px\"><\u002Ftextarea><\u002Flabel>\n      <label class=\"lb\">Projetos<input class=\"in\" value=\"{{me.projetos}}\" sc-camel-on-change=\"{{edMin.projetos}}\"><\u002Flabel>\n      <label class=\"toggle\"><input type=\"checkbox\" checked=\"{{me.publico}}\" sc-camel-on-change=\"{{togglePublico}}\">Exibir estas informações publicamente (site e materiais de divulgação)<\u002Flabel>\n      <div class=\"row wrap\"><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{saveMin}}\">Salvar<\u002Fbutton><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{go.conteudos}}\">Criar textos com IA<\u002Fbutton><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ SISTEMAS ============ -->\n  <sc-if value=\"{{scr.sistemas}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card-h\"><h1>Sistemas<\u002Fh1><span class=\"muted\">Você vê apenas os sistemas liberados para o seu perfil ({{roleLabel}}).<\u002Fspan><\u002Fdiv>\n    <div class=\"chips\">\n      <sc-for list=\"{{sysCats}}\" as=\"c\" hint-placeholder-count=\"5\"><button class=\"chip {{c.on}}\" type=\"button\" sc-camel-on-click=\"{{c.pick}}\">{{c.label}}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"g3\">\n      <sc-for list=\"{{sysList}}\" as=\"s\" hint-placeholder-count=\"6\">\n        <article class=\"sys-card\">\n          <div class=\"row\"><span class=\"sys-logo\" style=\"background: {{s.cor}}\">{{s.ini}}<\u002Fspan><div class=\"col\"><h3>{{s.nome}}<\u002Fh3><span class=\"muted small\">{{s.cat}}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <p class=\"muted\">{{s.desc}}<\u002Fp>\n          <div class=\"row\" style=\"justify-content: space-between\"><span class=\"badge {{s.stCls}}\">{{s.status}}<\u002Fspan><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{s.access}}\" disabled=\"{{s.off}}\">ACESSAR<svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 4h6v6M20 4l-9 9M18 14v6H4V6h6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p class=\"muted small\">Catálogo de exemplo — os sistemas, URLs e logos reais serão cadastrados no painel administrativo.<\u002Fp>\n  <\u002Fsc-if>\n\n  <!-- ============ SOLICITAÇÕES (lista) ============ -->\n  <sc-if value=\"{{scr.solicitacoes}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card-h\"><h1>Solicitações<\u002Fh1><button class=\"btn red\" type=\"button\" sc-camel-on-click=\"{{go.nova}}\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Nova solicitação<\u002Fbutton><\u002Fdiv>\n    <div class=\"chips\">\n      <sc-for list=\"{{reqFilters}}\" as=\"f\" hint-placeholder-count=\"6\"><button class=\"chip {{f.on}}\" type=\"button\" sc-camel-on-click=\"{{f.pick}}\">{{f.label}} · {{f.n}}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <input class=\"in\" placeholder=\"Buscar por protocolo, assunto ou categoria\" value=\"{{reqSearch}}\" sc-camel-on-change=\"{{onReqSearch}}\" aria-label=\"Buscar solicitações\">\n    <section class=\"card\" style=\"gap: 0; padding: 8px 20px\">\n      <sc-for list=\"{{reqList}}\" as=\"r\" hint-placeholder-count=\"3\">\n        <button class=\"li-btn\" type=\"button\" sc-camel-on-click=\"{{r.open}}\">\n          <span class=\"col\" style=\"flex: 1 1 auto\"><span class=\"row wrap\" style=\"gap: 8px\"><b>#{{r.id}}<\u002Fb><span>{{r.assunto}}<\u002Fspan><\u002Fspan><span class=\"muted small\">{{r.cat}} · {{r.equipe}} · aberta em {{r.criado}}<\u002Fspan><\u002Fspan>\n          <span class=\"badge {{r.stCls}}\">{{r.stLabel}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <sc-if value=\"{{reqEmpty}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"muted\" style=\"padding: 20px 0\">Nenhuma solicitação encontrada.<\u002Fp><\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ NOVA SOLICITAÇÃO ============ -->\n  <sc-if value=\"{{scr.nova}}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"btn ghost\" type=\"button\" sc-camel-on-click=\"{{go.solicitacoes}}\" style=\"align-self: flex-start; padding-left: 0\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"><\u002Fpath><\u002Fsvg>Solicitações<\u002Fbutton>\n    <h1>Nova solicitação<\u002Fh1>\n    <section class=\"card\">\n      <div class=\"col\" style=\"gap: 4px\"><h2>1. Sobre o que é?<\u002Fh2><span class=\"muted small\">Você não precisa saber qual equipe atende — a Central encaminha automaticamente.<\u002Fspan><\u002Fdiv>\n      <div class=\"chips\">\n        <sc-for list=\"{{catChips}}\" as=\"c\" hint-placeholder-count=\"10\"><button class=\"chip {{c.on}}\" type=\"button\" sc-camel-on-click=\"{{c.pick}}\">{{c.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{form.cat}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"note\">Será encaminhada para: <b>{{formTeam}}<\u002Fb><\u002Fp><\u002Fsc-if>\n    <\u002Fsection>\n    <section class=\"card\">\n      <h2>2. Conte os detalhes<\u002Fh2>\n      <label class=\"lb\">Assunto<input class=\"in\" value=\"{{form.assunto}}\" sc-camel-on-change=\"{{fm.assunto}}\" placeholder=\"Ex.: Folhetos para a conferência regional\"><\u002Flabel>\n      <label class=\"lb\">Descrição<textarea class=\"in\" value=\"{{form.desc}}\" sc-camel-on-change=\"{{fm.desc}}\" placeholder=\"O que você precisa, para quando e qualquer detalhe que ajude a equipe.\"><\u002Ftextarea><\u002Flabel>\n      <div class=\"g2\">\n        <sc-if value=\"{{perm.prioridade}}\" hint-placeholder-val=\"{{ false }}\">\n          <label class=\"lb\">Prioridade\n            <sc-raw-select class=\"in\" value=\"{{form.prioridade}}\" sc-camel-on-change=\"{{fm.prioridade}}\"><option value=\"Baixa\">Baixa<\u002Foption><option value=\"Normal\">Normal<\u002Foption><option value=\"Alta\">Alta<\u002Foption><option value=\"Urgente\">Urgente<\u002Foption><\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fsc-if>\n        <label class=\"lb\">Dados complementares (opcional)<input class=\"in\" value=\"{{form.comp}}\" sc-camel-on-change=\"{{fm.comp}}\" placeholder=\"Prazo, local, quantidade…\"><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"col\" style=\"gap: 8px\">\n        <span style=\"font-weight: 600; font-size: 14px\">Anexos<\u002Fspan>\n        <div class=\"row wrap\">\n          <sc-for list=\"{{form.anexos}}\" as=\"a\" hint-placeholder-count=\"0\"><span class=\"file\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7\"><\u002Fpath><\u002Fsvg>{{a.nome}}<\u002Fspan><\u002Fsc-for>\n          <label class=\"btn sec upl\">Adicionar arquivo<input class=\"file-in\" type=\"file\" multiple=\"{{yes}}\" sc-camel-on-change=\"{{onAttach}}\"><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{formErr}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\">{{formErr}}<\u002Fp><\u002Fsc-if>\n      <div class=\"row wrap\"><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{submitReq}}\">Enviar solicitação<\u002Fbutton><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{go.solicitacoes}}\">Cancelar<\u002Fbutton><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ PROTOCOLO ============ -->\n  <sc-if value=\"{{scr.protocolo}}\" hint-placeholder-val=\"{{ false }}\">\n    <section class=\"card\" style=\"align-items: center; text-align: center; padding: 40px 20px\">\n      <span class=\"av lg\" style=\"background: #DDF2E4; color: #1B6436\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"48\" height=\"48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <h1>Solicitação #{{lastId}}<\u002Fh1>\n      <p class=\"muted\" style=\"max-width: 460px\">Recebemos sua solicitação e ela foi encaminhada para <b>{{lastTeam}}<\u002Fb>. Você será notificado a cada mudança de status.<\u002Fp>\n      <div class=\"row wrap\" style=\"justify-content: center\"><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{openLast}}\">Acompanhar<\u002Fbutton><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{go.inicio}}\">Voltar ao início<\u002Fbutton><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ DETALHE ============ -->\n  <sc-if value=\"{{scr.detalhe}}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"btn ghost\" type=\"button\" sc-camel-on-click=\"{{backFromDetail}}\" style=\"align-self: flex-start; padding-left: 0\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"><\u002Fpath><\u002Fsvg>Voltar<\u002Fbutton>\n    <div class=\"card-h\"><div class=\"col\"><span class=\"muted\">Solicitação #{{sel.id}}<\u002Fspan><h1>{{sel.assunto}}<\u002Fh1><\u002Fdiv><span class=\"badge {{sel.stCls}}\" style=\"font-size: 15px; padding: 6px 14px\">{{sel.stLabel}}<\u002Fspan><\u002Fdiv>\n    <sc-if value=\"{{sel.waitingMine}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"note\" style=\"background: #FDE3DD; color: #7A1C0B\"><b>A equipe precisa de mais informações.<\u002Fb> Responda abaixo para a solicitação continuar.<\u002Fdiv><\u002Fsc-if>\n    <div class=\"g3\">\n      <section class=\"card span2\">\n        <h2>Detalhes<\u002Fh2>\n        <div class=\"g3\">\n          <div class=\"col\"><span class=\"muted small\">Categoria<\u002Fspan><b>{{sel.cat}}<\u002Fb><\u002Fdiv>\n          <div class=\"col\"><span class=\"muted small\">Equipe responsável<\u002Fspan><b>{{sel.equipe}}<\u002Fb><\u002Fdiv>\n          <div class=\"col\"><span class=\"muted small\">Prioridade<\u002Fspan><b>{{sel.prioridade}}<\u002Fb><\u002Fdiv>\n          <div class=\"col\"><span class=\"muted small\">Solicitante<\u002Fspan><b>{{sel.ownerNome}}<\u002Fb><\u002Fdiv>\n          <div class=\"col\"><span class=\"muted small\">Aberta em<\u002Fspan><b>{{sel.criado}}<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"white-space: pre-line\">{{sel.desc}}<\u002Fp>\n        <sc-if value=\"{{sel.foto}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"av lg\"><img sc-camel-src=\"{{sel.foto}}\" alt=\"Foto enviada\"><\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{sel.hasAnexos}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"row wrap\"><sc-for list=\"{{sel.anexos}}\" as=\"a\" hint-placeholder-count=\"1\"><span class=\"file\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7\"><\u002Fpath><\u002Fsvg>{{a.nome}}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n        <\u002Fsc-if>\n        <h2 style=\"margin-top: 8px\">Comentários<\u002Fh2>\n        <sc-for list=\"{{sel.coments}}\" as=\"c\" hint-placeholder-count=\"1\">\n          <div class=\"cm {{c.cls}}\"><span class=\"row\" style=\"gap: 8px\"><b>{{c.autor}}<\u002Fb><span class=\"muted small\">{{c.d}}<\u002Fspan><\u002Fspan><span style=\"white-space: pre-line\">{{c.t}}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{sel.noComents}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"muted\">Nenhum comentário ainda.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{sel.canComment}}\" hint-placeholder-val=\"{{ true }}\">\n          <label class=\"lb\">{{sel.commentLabel}}<textarea class=\"in\" value=\"{{comment}}\" sc-camel-on-change=\"{{onComment}}\" style=\"min-height: 80px\"><\u002Ftextarea><\u002Flabel>\n          <div class=\"row wrap\"><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{sendComment}}\">Enviar comentário<\u002Fbutton>\n            <sc-if value=\"{{sel.canCancel}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{cancelReq}}\">Cancelar solicitação<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n      <section class=\"card\">\n        <h2>Histórico<\u002Fh2>\n        <sc-if value=\"{{perm.admin}}\" hint-placeholder-val=\"{{ false }}\">\n          <label class=\"lb\">Alterar status (equipe)\n            <sc-raw-select class=\"in\" value=\"{{sel.status}}\" sc-camel-on-change=\"{{sel.onStatus}}\">\n              <option value=\"nova\">Nova<\u002Foption><option value=\"em_analise\">Em análise<\u002Foption><option value=\"em_andamento\">Em andamento<\u002Foption><option value=\"aguardando\">Aguardando missionário<\u002Foption><option value=\"concluida\">Concluída<\u002Foption><option value=\"cancelada\">Cancelada<\u002Foption><option value=\"rejeitada\">Rejeitada<\u002Foption><option value=\"arquivada\">Arquivada<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fsc-if>\n        <div class=\"tl\">\n          <sc-for list=\"{{sel.tl}}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div class=\"tl-i\"><span class=\"muted small\">{{t.d}}<\u002Fspan><p style=\"font-weight: 600\">{{t.t}}<\u002Fp><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ NOTIFICAÇÕES ============ -->\n  <sc-if value=\"{{scr.notificacoes}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card-h\"><h1>Notificações<\u002Fh1><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{markAllRead}}\">Marcar todas como lidas<\u002Fbutton><\u002Fdiv>\n    <section class=\"card\" style=\"gap: 0; padding: 8px 20px\">\n      <sc-for list=\"{{notifAll}}\" as=\"n\" hint-placeholder-count=\"4\">\n        <button class=\"li-btn\" type=\"button\" sc-camel-on-click=\"{{n.open}}\">\n          <span class=\"av sm {{n.avCls}}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z\"><\u002Fpath><path d=\"M10 21h4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span class=\"col\" style=\"flex: 1 1 auto\"><span style=\"font-weight: {{n.fw}}\">{{n.t}}<\u002Fspan><span class=\"muted small\">{{n.d}} · {{n.canal}}<\u002Fspan><\u002Fspan>\n          <sc-if value=\"{{n.novo}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"badge st-aguardando\">Nova<\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fsection>\n    <p class=\"muted small\">Canal atual: Central (Web). A estrutura já prevê e-mail e WhatsApp como canais futuros.<\u002Fp>\n  <\u002Fsc-if>\n\n  <!-- ============ CONTEÚDOS ============ -->\n  <sc-if value=\"{{scr.conteudos}}\" hint-placeholder-val=\"{{ false }}\">\n    <h1>Conteúdos<\u002Fh1>\n    <div class=\"g2\">\n      <section class=\"card\">\n        <div class=\"card-h\"><h2>Meus conteúdos<\u002Fh2><span class=\"muted small\">Usados no site e em divulgação<\u002Fspan><\u002Fdiv>\n        <div class=\"col\" style=\"gap: 0\">\n          <sc-for list=\"{{contents}}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div class=\"li\"><div class=\"col\" style=\"flex: 1 1 auto\"><b>{{c.tipo}}<\u002Fb><span class=\"muted small ellip\">{{c.resumo}}<\u002Fspan><\u002Fdiv><span class=\"badge {{c.cls}}\">{{c.status}}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section class=\"card\">\n        <div class=\"col\" style=\"gap: 4px\"><h2>Criar textos com IA<\u002Fh2><span class=\"muted small\">Descreva seu trabalho em uma frase. A IA sugere versões — você revisa antes de publicar.<\u002Fspan><\u002Fdiv>\n        <label class=\"lb\">Sobre o seu ministério<textarea class=\"in\" value=\"{{contentFact}}\" sc-camel-on-change=\"{{onContentFact}}\" style=\"min-height: 80px\"><\u002Ftextarea><\u002Flabel>\n        <button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{genContent}}\" style=\"align-self: flex-start\">Gerar sugestões<\u002Fbutton>\n        <sc-if value=\"{{contentOut}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"tabs\">\n            <sc-for list=\"{{contentTabs}}\" as=\"t\" hint-placeholder-count=\"5\"><button class=\"tab {{t.on}}\" type=\"button\" sc-camel-on-click=\"{{t.pick}}\">{{t.label}}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"out\">{{contentText}}<\u002Fdiv>\n          <p class=\"muted small\">Texto sugerido pela IA (simulado no protótipo). Revise antes de publicar.<\u002Fp>\n          <div class=\"row wrap\"><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{useContent}}\">Salvar como rascunho<\u002Fbutton><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{genContent}}\">Gerar novamente<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ AGENDA ============ -->\n  <sc-if value=\"{{scr.agenda}}\" hint-placeholder-val=\"{{ false }}\">\n    <h1>Agenda<\u002Fh1>\n    <div class=\"chips\">\n      <sc-for list=\"{{evFilters}}\" as=\"f\" hint-placeholder-count=\"5\"><button class=\"chip {{f.on}}\" type=\"button\" sc-camel-on-click=\"{{f.pick}}\">{{f.label}}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"g2\">\n      <sc-for list=\"{{eventsList}}\" as=\"e\" hint-placeholder-count=\"4\">\n        <article class=\"card\">\n          <div class=\"row\" style=\"align-items: flex-start\"><span class=\"ev-date\"><b>{{e.dia}}<\u002Fb><span>{{e.mes}}<\u002Fspan><\u002Fspan><div class=\"col\"><span class=\"tag\" style=\"align-self: flex-start\">{{e.tipo}}<\u002Fspan><h3>{{e.nome}}<\u002Fh3><span class=\"muted small\">{{e.data}} · {{e.hora}} · {{e.local}}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <p class=\"muted\">{{e.desc}}<\u002Fp>\n          <div class=\"row wrap\">\n            <sc-if value=\"{{e.inscricao}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn {{e.btnCls}}\" type=\"button\" sc-camel-on-click=\"{{e.toggle}}\">{{e.btnLabel}}<\u002Fbutton><\u002Fsc-if>\n            <button class=\"btn ghost\" type=\"button\" sc-camel-on-click=\"{{e.link}}\">Abrir link<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ RECURSOS ============ -->\n  <sc-if value=\"{{scr.recursos}}\" hint-placeholder-val=\"{{ false }}\">\n    <h1>Recursos<\u002Fh1>\n    <input class=\"in\" placeholder=\"Buscar manuais, guias, vídeos…\" value=\"{{resQuery}}\" sc-camel-on-change=\"{{onResQuery}}\" aria-label=\"Buscar recursos\">\n    <div class=\"chips\">\n      <sc-for list=\"{{resFilters}}\" as=\"f\" hint-placeholder-count=\"6\"><button class=\"chip {{f.on}}\" type=\"button\" sc-camel-on-click=\"{{f.pick}}\">{{f.label}}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"g3\">\n      <sc-for list=\"{{resList}}\" as=\"r\" hint-placeholder-count=\"6\">\n        <article class=\"card\"><span class=\"tag\" style=\"align-self: flex-start\">{{r.tipo}}<\u002Fspan><h3>{{r.nome}}<\u002Fh3><p class=\"muted\">{{r.desc}}<\u002Fp><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{r.open}}\" style=\"align-self: flex-start\">Abrir<\u002Fbutton><\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{resEmpty}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"muted\">Nada encontrado. Tente outro termo ou pergunte ao Assistente.<\u002Fp><\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ============ ASSISTENTE ============ -->\n  <sc-if value=\"{{scr.assistente}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card-h\"><h1>Assistente SEPAL<\u002Fh1><span class=\"tag\">Responde só com a base oficial e dentro das suas permissões<\u002Fspan><\u002Fdiv>\n    <section class=\"card\">\n      <div class=\"chat\">\n        <sc-for list=\"{{chat}}\" as=\"m\" hint-placeholder-count=\"2\">\n          <div class=\"msg {{m.from}}\">\n            <span>{{m.text}}<\u002Fspan>\n            <sc-if value=\"{{m.steps}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"steps\"><sc-for list=\"{{m.steps}}\" as=\"s\" hint-placeholder-count=\"3\"><div class=\"step\"><i class=\"{{s.cls}}\">{{s.icon}}<\u002Fi>{{s.t}}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{m.src}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"src\">Fonte: {{m.src}}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{m.action}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn sec\" type=\"button\" sc-camel-on-click=\"{{m.action.go}}\" style=\"align-self: flex-start\">{{m.action.label}}<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"chips\">\n        <sc-for list=\"{{suggestions}}\" as=\"sg\" hint-placeholder-count=\"3\"><button class=\"chip\" type=\"button\" sc-camel-on-click=\"{{sg.ask}}\">{{sg.t}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"ask\">\n        <input class=\"in\" placeholder=\"Digite sua pergunta…\" value=\"{{chatInput}}\" sc-camel-on-change=\"{{onChatInput}}\" sc-camel-on-key-down=\"{{chatKey}}\" aria-label=\"Sua pergunta\">\n        <button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{sendChat}}\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M4 12l16-8-6 16-2-7z\"><\u002Fpath><\u002Fsvg>Enviar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ MINHA EQUIPE (líder) ============ -->\n  <sc-if value=\"{{scr.equipe}}\" hint-placeholder-val=\"{{ false }}\">\n    <h1>Minha Equipe<\u002Fh1>\n    <p class=\"muted\">Missionários sob sua liderança e as solicitações abertas de cada um.<\u002Fp>\n    <div class=\"g3\">\n      <sc-for list=\"{{team}}\" as=\"p\" hint-placeholder-count=\"3\">\n        <section class=\"card\"><div class=\"row\"><span class=\"av\">{{p.ini}}<\u002Fspan><div class=\"col\"><h3>{{p.nome}}<\u002Fh3><span class=\"muted small\">{{p.local}}<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"row wrap\"><span class=\"tag\">{{p.area}}<\u002Fspan><span class=\"tag\">{{p.abertas}} solicitação(ões) aberta(s)<\u002Fspan><\u002Fdiv><\u002Fsection>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ ADMIN ============ -->\n  <sc-if value=\"{{scr.admin}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"card-h\"><h1>Painel administrativo<\u002Fh1><span class=\"tag\">Acesso: {{roleLabel}}<\u002Fspan><\u002Fdiv>\n    <div class=\"tabs\">\n      <sc-for list=\"{{adminTabs}}\" as=\"t\" hint-placeholder-count=\"5\"><button class=\"tab {{t.on}}\" type=\"button\" sc-camel-on-click=\"{{t.pick}}\">{{t.label}}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{at.demandas}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"g5\">\n        <sc-for list=\"{{queueStats}}\" as=\"st\" hint-placeholder-count=\"5\"><div class=\"stat\" style=\"cursor: default\"><span class=\"badge {{st.cls}}\">{{st.label}}<\u002Fspan><b>{{st.n}}<\u002Fb><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <section class=\"card\">\n        <div class=\"card-h\"><h2>Fila de demandas<\u002Fh2><span class=\"muted small\">Mude o status direto na fila — o missionário é notificado.<\u002Fspan><\u002Fdiv>\n        <div class=\"scrollx\"><div>\n          <div class=\"qrow head\"><span>Protocolo<\u002Fspan><span>Assunto<\u002Fspan><span>Solicitante<\u002Fspan><span>Equipe<\u002Fspan><span>Status<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{queue}}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div class=\"qrow\">\n              <button class=\"link-btn\" type=\"button\" sc-camel-on-click=\"{{r.open}}\" style=\"text-align: left\">#{{r.id}}<\u002Fbutton>\n              <span class=\"col\"><b class=\"ellip\">{{r.assunto}}<\u002Fb><span class=\"muted small\">{{r.cat}} · {{r.prioridade}}<\u002Fspan><\u002Fspan>\n              <span>{{r.ownerNome}}<\u002Fspan>\n              <span>{{r.equipe}}<\u002Fspan>\n              <sc-raw-select class=\"in\" value=\"{{r.status}}\" sc-camel-on-change=\"{{r.onStatus}}\" aria-label=\"Status\">\n                <option value=\"nova\">Nova<\u002Foption><option value=\"em_analise\">Em análise<\u002Foption><option value=\"em_andamento\">Em andamento<\u002Foption><option value=\"aguardando\">Aguardando missionário<\u002Foption><option value=\"concluida\">Concluída<\u002Foption><option value=\"cancelada\">Cancelada<\u002Foption><option value=\"rejeitada\">Rejeitada<\u002Foption><option value=\"arquivada\">Arquivada<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{at.usuarios}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"card\">\n        <div class=\"card-h\"><h2>Usuá
